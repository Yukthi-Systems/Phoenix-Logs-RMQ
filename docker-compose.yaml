# Local development stack: RabbitMQ + ClickHouse + the worker.
#
#   docker compose up --build
#
# Credentials below are for local use only. RabbitMQ's built-in "guest" user
# can only log in from localhost, so a dedicated user is created instead.

services:
  phoenix-logs-rmq:
    # build:
    #   context: .
    image: rjyspl/phoenix-logs-rmq:dev
    container_name: phoenix-logs-rmq
    env_file:
      - .env
    volumes:
      # Rotating JSON log files, written to ./logs on the host.
      - ./logs:/app/logs
    restart: unless-stopped
