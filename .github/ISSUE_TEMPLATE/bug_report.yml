name: 🐛 Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search
        [existing issues](https://github.com/Yukthi-Systems/Phoenix-Logs-RMQ/issues) first.

        **Never paste credentials, hostnames, or real message contents.** Redact them.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including a sample message (headers + body) if relevant.
      placeholder: |
        1. Start the stack with `docker compose up`
        2. Publish a message with header `type: fuglu` and body `{...}`
        3. See error ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Phoenix-Logs-RMQ version
      description: Output of `phoenix-logs-rmq -version`, or the Docker image tag.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Docker image (rjyspl/phoenix-logs-rmq)
        - docker compose (this repo)
        - Binary built from source
        - Kubernetes
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of the components involved.
      value: |
        - OS / arch:
        - Go version (if built from source):
        - RabbitMQ version:
        - ClickHouse version:
        - ClickHouse protocol (HTTP / native):
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Non-secret settings only (BATCH_SIZE, RB_WORKER_COUNT, timeouts...). **Remove all passwords.**
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Relevant JSON log lines. This will be rendered as code.
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all credentials and sensitive data from this report.
          required: true
