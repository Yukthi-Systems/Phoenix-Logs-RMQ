name: ✨ Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For open-ended ideas, consider starting a chat on
        [Discord](https://discord.com/invite/2BS7Z4FhJ) first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Include config names or message formats if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - RabbitMQ consumer
        - Validation / message formats
        - ClickHouse batching / inserts
        - Configuration
        - Docker / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
