# Publishes rjyspl/phoenix-logs-rmq to Docker Hub when a semver tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub user with push access to rjyspl/phoenix-logs-rmq
#   DOCKERHUB_TOKEN     Docker Hub access token (Account Settings -> Security)
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: rjyspl/phoenix-logs-rmq

jobs:
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag v1.2.3 produces: v1.2.3, v1.2, v1 and latest.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub overview from DOCKERHUB.md
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./DOCKERHUB.md
          short-description: "Consumes audit & mail-flow logs from RabbitMQ and bulk-inserts them into ClickHouse."
