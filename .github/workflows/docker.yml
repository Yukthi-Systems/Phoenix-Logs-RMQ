# Builds the rjyspl/phoenix-logs-rmq image and pushes it to Docker Hub.
#
#   push to main   -> rjyspl/phoenix-logs-rmq:latest, :main     (version main-<sha>)
#   push a tag     -> rjyspl/phoenix-logs-rmq:latest, :<tag>    (version <tag>)
#   pull request   -> build only, nothing is pushed
#
# Required repository secrets:
#   DOCKER_USERNAME  Docker Hub user with push access to rjyspl/phoenix-logs-rmq
#   DOCKER_PASSWORD  Docker Hub password or access token
name: Docker Build and Deploy

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE: rjyspl/phoenix-logs-rmq

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # TAG is the Docker tag (tag name or branch name); VERSION is what
      # `phoenix-logs-rmq -version` prints.
      - name: Determine Docker tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$TAG"
          else
            VERSION="${TAG}-${GITHUB_SHA::7}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Docker tag: $TAG, version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ steps.tag.outputs.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Overview
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./DOCKERHUB.md
